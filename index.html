function safetyMeeting(){let ns=S.nearMisses,types=[...new Set(ns.map(n=>n.type))];return `${header(present?'Safety meeting · Present mode':'Safety meeting','Private near-miss review, corrective actions and safety permit activity.',`<button class="btn" onclick="togglePresent()">${present?'Exit present mode':'▣ Present mode'}</button><button class="btn secondary" onclick="printMeeting('safety')">Print safety view</button>`)}<div class="split"><div>${panel('Near-miss review queue',`${ns.length} reports · review status and corrective action`,ns.map(n=>`<div class="permit-line"><div><b>${esc(n.title)} · ${esc(n.company)}</b><small>${esc(n.area)} · ${fmtDate(n.created)} · ${esc(n.action||'Corrective action not set')}</small><small>Owner: ${esc(n.owner||'Unassigned')} · Due ${fmtDate(n.due)}</small><button class="action-link" onclick="openItem('near','${n.id}')">Open private thread</button></div>${pill(n.status)}</div>`).join('')||'<div class="empty">No near misses reported.</div>')}${panel('Corrective actions due','Open items with an owner and due date.',ns.filter(n=>n.status!=='Closed').map(n=>`<div class="permit-line"><div><b>${esc(n.action||'Action needed')}</b><small>${esc(n.owner||'Unassigned')} · ${fmtDate(n.due)} · ${esc(n.company)}</small></div>${pill(n.status)}</div>`).join('')||'<div class="empty">No open actions.</div>')}</div><div>${panel('Near misses by type',`Reported through ${dateLabel}`,`<div class="bars">${types.map(t=>{let c=ns.filter(n=>n.type===t).length;return `<div class="bar-row"><span class="bar-label">${esc(t)}</span><span class="bar-track"><span class="bar-fill" style="display:block;width:${Math.max(15,c/ns.length*100)}%"></span></span><span class="bar-value">${c}</span></div>`}).join('')}</div>`)}${panel('Near misses by trade and area','Demo counts from the current review set.',`<div class="cards">${['trade','area'].map(by=>{let vals=[...new Set(ns.map(n=>n[by]))];return `<article class="item-card"><h3>By ${by}</h3><p>${vals.map(v=>`${esc(v)} · ${ns.filter(n=>n[by]===v).length}`).join('<br>')||'No reports'}</p></article>`}).join('')}</div>`)}${panel('Permits by type this week','Requests and approvals in the current sample.',`<div class="bars">${[...new Set(S.permits.map(p=>p.type))].map(t=>`<div class="bar-row"><span class="bar-label">${esc(t)}</span><span class="bar-track"><span class="bar-fill" style="display:block;width:${S.permits.filter(p=>p.type===t).length*35}%"></span></span><span class="bar-value">${S.permits.filter(p=>p.type===t).length}</span></div>`).join('')}</div>`)}</div></div>`}
function submissionsPage(){let list=S.reports.filter(r=>role==='gc'||r.company===onlyCompany);return `${header('Submissions','Report history for the project. Open a record to print or review its conversation.',`<button class="btn secondary" onclick="window.print()">Print submissions</button>`)}${panel('Report history',`${list.length} items`,list.length?`<div class="matrix-wrap"><table class="matrix"><thead><tr><th>Trade partner</th><th>Report</th><th>Date</th><th>Status</th><th>Time</th><th></th></tr></thead><tbody>${list.map(r=>`<tr><td>${esc(r.company)}</td><td>${esc(r.type)}</td><td>${fmtDate(r.date)}</td><td>${pill(r.status)}</td><td>${esc(r.time||'—')}</td><td><button class="btn secondary small" onclick="openCompany('${esc(r.company)}')">Open</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No submissions available.</div>')}`}
function render(){document.body.classList.toggle('present',present);document.querySelector('#nav').innerHTML=navMarkup();document.querySelector('#mobileNav').className=`mobile-nav ${role==='gc'?'gc':''}`;document.querySelector('#mobileNav').innerHTML=(role==='sub'?navSub:[...navGC.slice(0,5),navGC[5]]).map(([p,t])=>`<button class="${p===page?'active':''}" onclick="go('${p}')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>${t}</button>`).join('');document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===role));let names=role==='gc'?['Jordan Davis','JD','GC project team']:['Marcus Lee','ML','BrightSpark Electric · Foreman'];document.querySelector('#profileName').textContent=names[0];document.querySelector('#avatar').textContent=names[1];document.querySelector('#profileRole').textContent=names[2];document.querySelector('#crumb').textContent=page.replace('-',' ').replace(/\b\w/g,c=>c.toUpperCase());let html=page==='overview'&&role==='gc'?gcHome():page==='today'||(page==='overview'&&role==='sub')?subToday():page==='permits'?permitsPage():page==='lookahead'?lookaheadPage():page==='restraints'||page==='near-misses'?cardsPage(page):page==='meetings'?`<div class="split"><div>${meetingsPage()}</div><div>${safetyMeeting()}</div></div>`:page==='safety-meeting'?safetyMeeting():page==='submissions'?submissionsPage():gcHome();if(role==='sub'){document.querySelector('#navLabel').textContent='My company';html=html.replace(/\b\d+\s+open restraints\b/g,'');}else document.querySelector('#navLabel').textContent='Project workspace';document.querySelector('#app').innerHTML=html;save()}
function go(p){page=p;render()}function togglePresent(){present=!present;render()}function toast(msg){let t=document.querySelector('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}function showModal(html){document.querySelector('#modal').innerHTML=html;document.querySelector('#backdrop').classList.add('open')}function closeModal(){document.querySelector('#backdrop').classList.remove('open')}function field(label,name,placeholder='',wide=false,type='text'){return `<div class="field ${wide?'wide':''}"><label>${label}</label><input name="${name}" type="${type}" placeholder="${placeholder}" ${type==='date'?'':''}></div>`}function textarea(label,name,placeholder='',wide=true){return `<div class="field ${wide?'wide':''}"><label>${label}</label><textarea name="${name}" placeholder="${placeholder}"></textarea></div>`}function selectField(label,name,opts,wide=false){return `<div class="field ${wide?'wide':''}"><label>${label}</label><select name="${name}">${opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select></div>`}function openForm(kind){let title='',body='',company=onlyCompany;if(kind==='hazard'){title='Pre-task hazard analysis';body=`${field('Work task','task','What work is planned?',true)}<div class="field wide"><label>Hazards to review</label><div class="checks">${['Working at height','Electrical energy','Lifting / suspended loads','Slips and trips','Dust / silica','Occupied or patient areas','Other'].map(x=>`<label class="check-chip"><input type="checkbox" name="hazards" value="${x}">${x}</label>`).join('')}</div></div>${textarea('Additional hazards','otherHazards','Describe any other hazards')}${textarea('Controls and safe work steps','controls','How will your crew control these hazards?')}${field('PPE required','ppe','e.g. eye protection, gloves')}`}
else if(kind==='workplan'){title='Daily work plan';body=`<div class="field wide"><label>Work areas</label><div class="checks">${areas.map(a=>`<label class="check-chip"><input type="checkbox" name="areas" value="${a}">${a}</label>`).join('')}</div></div>${textarea('Tasks planned today','tasks','Work to be completed',true)}${field('Crew on site','headcount','Headcount only',false,'number')}<div class="field wide"><label>Permits needed today</label><div class="checks">${permitCatalog.filter(p=>p.core).map(p=>`<label class="check-chip"><input type="checkbox" name="permits" value="${p.type}">${p.type}</label>`).join('')}</div></div><div class="field wide"><label>Equipment in use</label><div class="checks">${['Scissor / boom lift','Forklift','Crane','Hoist','Other'].map(x=>`<label class="check-chip"><input type="checkbox" name="equipment" value="${x}">${x}</label>`).join('')}</div></div>${textarea('Deliveries expected','deliveries','What, when and laydown location?')}${textarea('Other trades or tier-2 subs','others','Who else is working under your company?')}${textarea('Access or coordination needed','coordination','What do you need from the GC or other trades?')}<div class="field"><label>Can you start as planned?</label><select name="start" id="startSelect"><option>Yes</option><option>No</option></select></div>${textarea('If no, explain why','startReason','Reason required if you cannot start as planned')}`}
else if(kind==='permit'){title='Request a permit';let byGroup={};permitCatalog.forEach(p=>(byGroup[p.group]??=[]).push(p.type));body=`${selectField('Permit type','type',Object.keys(byGroup).flatMap(g=>byGroup[g].map(x=>`${g} · ${x}`)),true)}<div class="field"><label>Work area</label><select name="area">${areas.map(a=>`<option>${a}</option>`).join('')}</select></div>${field('Requested time window','timeWindow','e.g. 8:00 AM–2:00 PM')}<div class="field wide" id="permitSpecific"></div>${textarea('Work scope / safety controls','scope','Describe scope and controls',true)}<div class="field wide"><label>Photos are not saved in this demo</label><input type="file" name="photos" accept="image/*" multiple></div>`}
else if(kind==='lookahead'){title='Tomorrow’s work look-ahead';body=`<div class="field wide"><label>Work areas</label><div class="checks">${areas.map(a=>`<label class="check-chip"><input type="checkbox" name="areas" value="${a}">${a}</label>`).join('')}</div></div>${textarea('Trade and planned work','tasks','What will your crew work on tomorrow?',true)}${field('Expected crew headcount','headcount','Headcount only',false,'number')}`}
else if(kind==='closeout'){title='End-of-day close-out';let plan=req(company,'Work plan')?.tasks||'';body=`${field('Actual crew headcount','actual','Number of workers',false,'number')}${field('Total man-hours','hours','Crew hours for the day',false,'number')}<div class="field wide"><label>Planned task completion</label><p style="font-size:11px;color:var(--muted);margin:0">${esc(plan||'Add task names below and mark done, partial, or not done.')}</p><div class="checks">${['Done','Partial','Not done'].map(x=>`<label class="check-chip"><input type="radio" name="taskStatus" value="${x}">${x}</label>`).join('')}</div></div>${textarea('Reason for partial / not done','reason','Explain delay or remaining work')}${textarea('New issues today','issues','Describe any new issues or obstacles')}${selectField('Any permits used are closed out?','permitClosed',['Yes','No, still active'])}`}

else if(kind==='near'){title='Report a near miss';body=`${field('What happened or could have happened?','title','Short summary',true)}${selectField('Near-miss type','type',['Slip / trip','Struck-by','Pinch point','Electrical','Fall protection','Equipment','Other'])}${selectField('Area','area',areas)}${textarea('Describe the event','details','Include what happened and immediate response',true)}${field('Corrective action owner','owner','Name')}${field('Action due date','due','',false,'date')}<div class="field wide"><label>Photos are not saved in this demo</label><input type="file" name="photos" accept="image/*" multiple></div>`}
document.querySelector('#modal').dataset.kind=kind;showModal(`<div class="modal-head"><div><div class="kicker">${esc(company)} · ${dateLabel}</div><h2>${title}</h2><p>Visible to the GC and your company only where privacy applies.</p></div><button class="close" onclick="closeModal()">×</button></div><form id="entryForm"><div class="modal-body"><div class="form-grid">${body}</div></div><div class="modal-foot"><span style="font-size:11px;color:var(--muted)">Not submitted until you save.</span><div><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button> <button class="btn" type="submit">Submit</button></div></div></form>`);let form=document.querySelector('#entryForm');if(kind==='permit'){let sel=form.elements.type,sp=document.querySelector('#permitSpecific');function fields(){let type=sel.value.split(' · ').at(-1),p=permitCatalog.find(x=>x.type===type);sp.innerHTML=p?p.fields.map((f,i)=>field(f,'detail'+i,'Add '+f)).join(''):''}sel.onchange=fields;fields()}form.onsubmit=e=>{e.preventDefault();submitForm(kind,new FormData(form))}}
function values(fd,key){return fd.getAll(key)}function submitForm(kind,fd){let me=onlyCompany;if(kind==='hazard'||kind==='workplan'){let type=kind==='hazard'?'Hazard analysis':'Work plan',rec={id:id(kind),company:me,trade:'Electrical',type,status:'submitted',date:dayKey,time:new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})};if(kind==='hazard')Object.assign(rec,{task:fd.get('task'),hazards:values(fd,'hazards'),otherHazards:fd.get('otherHazards'),controls:fd.get('controls'),ppe:fd.get('ppe')});else{Object.assign(rec,{areas:values(fd,'areas'),tasks:fd.get('tasks'),headcount:+fd.get('headcount'),equipment:values(fd,'equipment'),deliveries:fd.get('deliveries'),others:fd.get('others'),coordination:fd.get('coordination'),start:fd.get('start')==='Yes'});S.reports=S.reports.filter(x=>!(x.company===me&&x.type===type&&x.date===dayKey));if(!rec.start){let rs={id:id('r'),title:'Cannot start as planned',company:me,trade:'Electrical',type:'Other',area:rec.areas[0]||'Site',needBy:dayKey,ball:'GC',status:'Open',created:dayKey,details:fd.get('startReason'),comments:[]};S.restraints.unshift(rs)}values(fd,'permits').forEach(t=>S.permits.unshift({id:id('p'),type:t,company:me,trade:'Electrical',area:rec.areas[0]||'Site',date:dayKey,status:'Requested',requested:rec.time,details:{},overlap:false}))}S.reports.unshift(rec)}
if(kind==='permit'){let [group,type]=fd.get('type').split(' · '),details={};for(let i=0;i<5;i++)if(fd.get('detail'+i))details[permitCatalog.find(p=>p.type===type)?.fields[i]||'Detail']=fd.get('detail'+i);let area=fd.get('area');let overlap=['Hot work','Critical lift / crane setup','Floor / roof opening cover removal','Coring / saw cutting / drilling','ICRA / dust and infection control'].includes(type)&&S.lookaheads.some(l=>l.date===dayKey&&l.company!==me&&l.areas.includes(area));S.permits.unshift({id:id('p'),type,group,company:me,trade:'Electrical',area,date:dayKey,status:'Requested',requested:new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),details,scope:fd.get('scope'),overlap})}
if(kind==='lookahead'){S.lookaheads=S.lookaheads.filter(l=>!(l.company===me&&l.date===shiftDate(1)));S.lookaheads.unshift({id:id('l'),company:me,trade:'Electrical',areas:values(fd,'areas'),tasks:fd.get('tasks'),headcount:+fd.get('headcount'),date:shiftDate(1)})}
if(kind==='closeout'){S.closeouts=S.closeouts.filter(c=>!(c.company===me&&c.date===shiftDate(-1)));S.closeouts.unshift({company:me,date:dayKey,actual:+fd.get('actual'),hours:+fd.get('hours'),tasks:[{name:req(me,'Work plan')?.tasks||'Planned work',status:fd.get('taskStatus')||'Done',reason:fd.get('reason')}],issues:fd.get('issues'),permitsClosed:fd.get('permitClosed')})}
if(kind==='restraint')S.restraints.unshift({id:id('r'),title:fd.get('title'),company:me,trade:'Electrical',type:fd.get('type'),area:fd.get('area'),needBy:fd.get('needBy')||dayKey,ball:'GC',status:'Open',created:dayKey,details:fd.get('details'),comments:[]});if(kind==='near')S.nearMisses.unshift({id:id('n'),title:fd.get('title'),company:me,trade:'Electrical',type:fd.get('type'),area:fd.get('area'),status:'Submitted',created:dayKey,details:fd.get('details'),action:'',owner:fd.get('owner'),due:fd.get('due'),comments:[]});closeModal();render();toast('Submitted to the GC project team')}
function permitDecision(pid,decision){let p=S.permits.find(x=>x.id===pid);if(!p)return;if(decision==='deny'){let reason=prompt('Reason for denying this permit:');if(!reason?.trim())return toast('A denial reason is required');p.status='Denied';p.reason=reason}else{let conditions=prompt('Approval conditions (fire watch, time window, area limits). Leave blank if none:','');p.status='Approved';p.approvedBy='Jordan Davis';p.conditions=conditions||'';p.expires=prompt('Expiry time (defaults to end of day):','End of day')||'End of day'}render();toast(`Permit ${p.status.toLowerCase()}`)}function setPermit(pid,status){let p=S.permits.find(x=>x.id===pid);if(p){p.status=status;render();toast(`Permit marked ${status.toLowerCase()}`)}}function reviewNear(nid){let n=S.nearMisses.find(x=>x.id===nid);if(!n)return;n.status=n.status==='Submitted'?'Under review':'Reviewed in safety meeting';render();openItem('near',nid)}
